<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>刺猬 · 内容管理后台</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-container: rgba(255, 255, 255, 0.6);
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: rgba(255, 255, 255, 0.95);
            --bg-input: rgba(255, 255, 255, 0.7);
            --bg-tab: rgba(255, 255, 255, 0.5);
            --bg-tab-active: rgba(255, 255, 255, 0.9);
            --bg-modal: rgba(255, 255, 255, 0.98);
            --bg-upload: rgba(255, 255, 255, 0.4);
            --bg-upload-hover: rgba(255, 255, 255, 0.7);
            --bg-toggle-off: #d0d5dd;
            --bg-toggle-on: rgba(26, 26, 46, 0.7);

            --text-primary: #1a1a2e;
            --text-secondary: #555;
            --text-muted: #999;
            --text-inverse: #fff;
            --text-tab-active: #1a1a2e;
            --text-tab-inactive: #888;

            --border-color: rgba(0, 0, 0, 0.06);
            --border-focus: rgba(26, 26, 46, 0.3);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.06);
            --shadow-modal: 0 20px 60px rgba(0, 0, 0, 0.25);
            --glass-border: rgba(255, 255, 255, 0.5);

            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition-base: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.4s cubic-bezier(0.22, 1, 0.36, 1);

            --accent: #58a6ff;
            --accent-hover: #4a8edb;
            --accent-glow: rgba(88, 166, 255, 0.25);
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --pinned-bg: rgba(0, 0, 0, 0.06);
            --pinned-text: #888;
        }

        [data-theme="dark"] {
            --bg-body: #0a0a0f;
            --bg-container: rgba(255, 255, 255, 0.04);
            --bg-card: rgba(255, 255, 255, 0.06);
            --bg-card-hover: rgba(255, 255, 255, 0.10);
            --bg-input: rgba(255, 255, 255, 0.06);
            --bg-tab: rgba(255, 255, 255, 0.04);
            --bg-tab-active: rgba(255, 255, 255, 0.10);
            --bg-modal: rgba(12, 12, 24, 0.98);
            --bg-upload: rgba(255, 255, 255, 0.04);
            --bg-upload-hover: rgba(255, 255, 255, 0.08);
            --bg-toggle-off: rgba(255, 255, 255, 0.2);
            --bg-toggle-on: rgba(88, 166, 255, 0.4);

            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.4);
            --text-inverse: #1a1a2e;
            --text-tab-active: #fff;
            --text-tab-inactive: rgba(255, 255, 255, 0.4);

            --border-color: rgba(255, 255, 255, 0.06);
            --border-focus: rgba(88, 166, 255, 0.4);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-modal: 0 20px 60px rgba(0, 0, 0, 0.6);
            --glass-border: rgba(255, 255, 255, 0.06);
            --pinned-bg: rgba(255, 255, 255, 0.06);
            --pinned-text: rgba(255, 255, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 16px 60px;
            transition: background var(--transition-slow), color var(--transition-slow);
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 960px;
            width: 100%;
        }

        /* ===== 顶部 ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 0 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 24px;
            transition: border-color var(--transition-slow);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-left .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            transition: color var(--transition-slow);
        }
        .header-left .logo span {
            color: var(--accent);
        }
        .header-left .badge {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 2px 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            transition: all var(--transition-slow);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 40px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            backdrop-filter: blur(20px);
        }
        .theme-toggle:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-focus);
        }
        .theme-toggle:active {
            transform: scale(0.95);
        }

        .token-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: all var(--transition-base);
            font-family: inherit;
        }
        .token-status:hover {
            background: var(--bg-card-hover);
        }
        .token-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            transition: background 0.3s;
        }
        .token-status .dot.on {
            background: var(--success);
        }
        .token-status .dot.off {
            background: var(--text-muted);
        }

        /* ===== Tab ===== */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            background: var(--bg-container);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            transition: all var(--transition-slow);
            flex-wrap: wrap;
        }
        .tabs .tab {
            flex: 1;
            min-width: 80px;
            padding: 10px 16px;
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-tab-inactive);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-base);
            font-family: inherit;
            text-align: center;
        }
        .tabs .tab:hover {
            color: var(--text-primary);
            background: var(--bg-card);
        }
        .tabs .tab.active {
            background: var(--bg-tab-active);
            color: var(--text-tab-active);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        .tabs .tab .tab-icon {
            margin-right: 6px;
        }

        .panel {
            display: none;
            animation: fadeUp 0.4s ease forwards;
        }
        .panel.active {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .panel-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }
        .panel-header h2 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            transition: color var(--transition-slow);
        }
        .panel-header .panel-count {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all var(--transition-base);
            font-family: inherit;
            text-decoration: none;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px var(--accent-glow);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-focus);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-danger:hover {
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.25);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }
        .btn-xs {
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 20px;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            transition: all var(--transition-base);
            backdrop-filter: blur(20px);
        }
        .card-item:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-focus);
            box-shadow: var(--shadow-card);
        }
        .card-item .card-info {
            flex: 1;
            min-width: 160px;
        }
        .card-item .card-info .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            transition: color var(--transition-slow);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card-item .card-info .card-title .pinned-tag {
            font-size: 11px;
            font-weight: 500;
            color: var(--pinned-text);
            background: var(--pinned-bg);
            padding: 1px 10px;
            border-radius: 12px;
            letter-spacing: 0.3px;
        }
        .card-item .card-info .card-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
            transition: color var(--transition-slow);
        }
        .card-item .card-info .card-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color var(--transition-slow);
        }
        .card-item .card-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
            cursor: pointer;
            border-radius: 12px;
            background: var(--bg-toggle-off);
            transition: background var(--transition-base);
            border: none;
            padding: 0;
        }
        .toggle-switch.on {
            background: var(--bg-toggle-on);
        }
        .toggle-switch .toggle-knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            transition: transform var(--transition-base), background var(--transition-base);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }
        .toggle-switch.on .toggle-knob {
            transform: translateX(20px);
            background: #fff;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            transition: all var(--transition-slow);
        }
        .empty-state .empty-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .empty-state .empty-text {
            font-size: 14px;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-box {
            background: var(--bg-modal);
            border-radius: var(--radius-lg);
            padding: 28px 24px 24px;
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-modal);
            animation: modalSlide 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            transition: background var(--transition-slow), border-color var(--transition-slow);
        }
        .modal-box::-webkit-scrollbar {
            width: 4px;
        }
        .modal-box::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 4px;
        }
        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-box .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            transition: color var(--transition-slow);
        }
        .modal-box .modal-sub {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .modal-box label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
            margin-top: 12px;
            transition: color var(--transition-slow);
        }
        .modal-box label:first-of-type {
            margin-top: 0;
        }
        .modal-box input,
        .modal-box textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: all var(--transition-base);
            outline: none;
        }
        .modal-box input:focus,
        .modal-box textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .modal-box textarea {
            min-height: 80px;
            resize: vertical;
        }
        .modal-box .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        /* ===== 上传 ===== */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-sm);
            padding: 20px 16px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-base);
            background: var(--bg-upload);
            color: var(--text-muted);
            margin-top: 4px;
        }
        .upload-area:hover {
            border-color: var(--accent);
            background: var(--bg-upload-hover);
        }
        .upload-area.dragover {
            border-color: var(--accent);
            background: var(--bg-upload-hover);
            transform: scale(1.01);
        }
        .upload-area .upload-icon {
            font-size: 28px;
            display: block;
        }
        .upload-area .upload-text {
            font-size: 13px;
        }
        .upload-area input[type="file"] {
            display: none;
        }

        .upload-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .upload-preview .preview-item {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: var(--bg-body);
        }
        .upload-preview .preview-item img,
        .upload-preview .preview-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .upload-status {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
            min-height: 20px;
        }
        .upload-status .success {
            color: var(--success);
        }
        .upload-status .error {
            color: var(--danger);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            z-index: 2000;
            box-shadow: var(--shadow-modal);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            border-color: var(--danger);
            color: var(--danger);
        }
        .toast.success {
            border-color: var(--success);
            color: var(--success);
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .avatar-preview-wrap {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 4px;
        }
        .avatar-preview-wrap .avatar-img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
            background: var(--bg-body);
            transition: border-color var(--transition-slow);
        }
        .avatar-preview-wrap .avatar-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .settings-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .settings-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .settings-row label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .settings-row input,
        .settings-row textarea {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: all var(--transition-base);
            outline: none;
            width: 100%;
        }
        .settings-row input:focus,
        .settings-row textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .settings-row textarea {
            resize: vertical;
            min-height: 80px;
        }
        .settings-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px 10px 40px;
            }
            .header {
                padding: 10px 0 14px;
            }
            .header-left .logo {
                font-size: 19px;
            }
            .header-left .badge {
                font-size: 10px;
                padding: 1px 10px;
            }
            .theme-toggle {
                padding: 6px 10px;
                font-size: 12px;
            }
            .theme-toggle .toggle-label-text {
                display: none;
            }
            .token-status {
                font-size: 11px;
                padding: 4px 10px;
            }
            .token-status .token-label-text {
                display: none;
            }
            .tabs .tab {
                font-size: 12px;
                padding: 8px 10px;
                min-width: 60px;
            }
            .tabs .tab .tab-icon {
                margin-right: 3px;
            }
            .card-item {
                padding: 12px 14px;
                flex-direction: column;
                align-items: stretch;
            }
            .card-item .card-actions {
                justify-content: flex-start;
                margin-top: 4px;
            }
            .modal-box {
                padding: 20px 16px;
                max-height: 95vh;
            }
            .modal-actions {
                flex-wrap: wrap;
            }
            .modal-actions .btn {
                flex: 1;
                justify-content: center;
            }
            .settings-grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <header class="header">
            <div class="header-left">
                <div class="logo">🦔 <span>Ciwei</span>Manager</div>
                <span class="badge" id="statusBadge">未同步</span>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="themeToggle">
                    <span id="themeIcon">🌙</span>
                    <span class="toggle-label-text" id="themeLabel">深色</span>
                </button>
                <button class="token-status" id="tokenStatusBtn">

    <script>
        // ================================================================
        // 配置
        // ================================================================
        const REPO = 'xiaociwei01/CiweiManager';
        const CONFIG_PATH = 'config.json';
        const STORAGE_KEY = 'ciwei_manager_token';
        const THEME_KEY = 'ciwei_manager_theme';
        const DEFAULT_AVATAR = 'ciweitouxiang.jpg';

        // ================================================================
        // DOM 引用
        // ================================================================
        const $ = id => document.getElementById(id);
        const toast = $('toast');
        let toastTimer = null;
        let configData = null;
        let editingWorkId = null;
        let editingFriendId = null;
        let workCoverFile = null;
        let friendMediaFiles = [];

        // ================================================================
        // 工具函数
        // ================================================================
        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
            requestAnimationFrame(() => toast.classList.add('show'));
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        function getToken() {
            return localStorage.getItem(STORAGE_KEY) || '';
        }

        function setToken(t) {
            if (t && t.startsWith('ghp_')) {
                localStorage.setItem(STORAGE_KEY, t);
                return true;
            }
            return false;
        }

        function clearToken() {
            localStorage.removeItem(STORAGE_KEY);
        }

        function updateTokenUI() {
            const token = getToken();
            const dot = $('tokenDot');
            const label = $('tokenLabel');
            if (token) {
                dot.className = 'dot on';
                label.textContent = '已配置';
            } else {
                dot.className = 'dot off';
                label.textContent = '未配置';
            }
        }

        function buildCdnUrl(path) {
            if (!path) return '';
            if (path.startsWith('http://') || path.startsWith('https://')) return path;
            if (path === DEFAULT_AVATAR) {
                return `https://xiaociwei01.github.io/CiweiHome/${DEFAULT_AVATAR}`;
            }
            return `https://cdn.jsdelivr.net/gh/${REPO}@main/${path}`;
        }

        function formatDateToMinute(dateStr) {
            if (!dateStr) return '未知日期';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                const h = String(d.getHours()).padStart(2, '0');
                const min = String(d.getMinutes()).padStart(2, '0');
                return `${y}-${m}-${day} ${h}:${min}`;
            } catch {
                return dateStr;
            }
        }

        function getCurrentTimeMinute() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const h = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            return `${y}-${m}-${day} ${h}:${min}`;
        }

        // ================================================================
        // 主题
        // ================================================================
        function getPreferredTheme() {
            const saved = localStorage.getItem(THEME_KEY);
            if (saved === 'dark' || saved === 'light') return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
            const icon = $('themeIcon');
            const label = $('themeLabel');
            if (theme === 'dark') {
                icon.textContent = '☀️';
                label.textContent = '浅色';
            } else {
                icon.textContent = '🌙';
                label.textContent = '深色';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        applyTheme(getPreferredTheme());
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem(THEME_KEY)) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });
        $('themeToggle').addEventListener('click', toggleTheme);

        // ================================================================
        // Token
        // ================================================================
        updateTokenUI();

        $('tokenStatusBtn').addEventListener('click', () => {
            $('tokenModal').classList.add('active');
            $('tokenInput').value = getToken();
            $('tokenInput').focus();
        });

        $('tokenSaveBtn').addEventListener('click', () => {
            const val = $('tokenInput').value.trim();
            if (setToken(val)) {
                updateTokenUI();
                $('tokenModal').classList.remove('active');
                $('tokenHint').textContent = '✅ Token 已保存';
                showToast('✅ Token 已保存');
                loadConfig();
            } else if (!val) {
                clearToken();
                updateTokenUI();
                $('tokenModal').classList.remove('active');
                $('tokenHint').textContent = '⚠️ Token 已清除';
                showToast('Token 已清除');
            } else {
                $('tokenHint').textContent = '⚠️ Token 格式错误，应以 ghp_ 开头';
                showToast('⚠️ Token 格式错误', 'error');
            }
        });

        $('tokenClearBtn').addEventListener('click', () => {
            clearToken();
            updateTokenUI();
            $('tokenInput').value = '';
            $('tokenHint').textContent = '⚠️ Token 已清除';
            showToast('Token 已清除');
            $('tokenModal').classList.remove('active');
        });

        $('tokenInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') $('tokenSaveBtn').click();
        });

        // ================================================================
        // 数据加载与保存
        // ================================================================
        async function loadConfig() {
            const token = getToken();
            try {
                const cdnUrl =
                    `https://cdn.jsdelivr.net/gh/${REPO}@main/${CONFIG_PATH}?t=${Date.now()}`;
                let res = await fetch(cdnUrl, { cache: 'no-store' });
                if (!res.ok) {
                    const rawUrl =
                        `https://raw.githubusercontent.com/${REPO}/main/${CONFIG_PATH}?t=${Date.now()}`;
                    res = await fetch(rawUrl, { cache: 'no-store' });
                    if (!res.ok) throw new Error('加载失败');
                }
                configData = await res.json();
                $('statusBadge').textContent = '✅ 已同步';
                $('statusBadge').style.color = 'var(--success)';
                renderAll();
                return configData;
            } catch (err) {
                console.warn('加载失败，使用缓存/默认', err);
                if (!configData) {
                    configData = {
                        site: {
                            title: '刺猬',
                            subtitle: '独立开发者',
                            avatar: DEFAULT_AVATAR,
                            signature: '本站点使用 HTML+CSS+JavaScript 语言开发...',
                            wechat: 'As08_0831',
                            qq: '2586279833'
                        },
                        works: [],
                        friends: []
                    };
                }
                $('statusBadge').textContent = '⚠️ 未同步（使用本地缓存）';
                $('statusBadge').style.color = 'var(--warning)';
                renderAll();
                return configData;
            }
        }

        async function saveConfig() {
            const token = getToken();
            if (!token) {
                showToast('⚠️ 请先配置 GitHub Token', 'error');
                $('tokenModal').classList.add('active');
                return false;
            }
            if (!configData) {
                showToast('⚠️ 无数据可保存', 'error');
                return false;
            }

            const btn = $('saveSettingsBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> 保存中...';

            try {
                const content = JSON.stringify(configData, null, 2);
                const url = `https://api.github.com/repos/${REPO}/contents/${CONFIG_PATH}`;
                let sha = '';
                try {
                    const getRes = await fetch(url, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    if (getRes.ok) {
                        const data = await getRes.json();
                        sha = data.sha;
                    }
                } catch (e) {}

                const payload = {
                    message: `更新配置: ${new Date().toLocaleString()}`,
                    content: btoa(unescape(encodeURIComponent(content))),
                    branch: 'main'
                };
                if (sha) payload.sha = sha;

                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || '保存失败');
                }

                showToast('✅ 配置已保存到 GitHub');
                $('statusBadge').textContent = '✅ 已同步';
                $('statusBadge').style.color = 'var(--success)';
                btn.innerHTML = originalText;
                btn.disabled = false;
                return true;
            } catch (err) {
                showToast('❌ 保存失败：' + err.message, 'error');
                btn.innerHTML = originalText;
                btn.disabled = false;
                return false;
            }
        }

        // ================================================================
        // 文件上传/删除
        // ================================================================
        async function uploadFileToGitHub(path, base64Content, message = '上传文件') {
            const token = getToken();
            if (!token) {
                showToast('⚠️ 请先配置 Token', 'error');
                $('tokenModal').classList.add('active');
                return null;
            }
            try {
                const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
                let sha = '';
                try {
                    const getRes = await fetch(url, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    if (getRes.ok) {
                        const data = await getRes.json();
                        sha = data.sha;
                    }
                } catch (e) {}

                const payload = {
                    message: message,
                    content: base64Content.split(',')[1] || base64Content,
                    branch: 'main'
                };
                if (sha) payload.sha = sha;

                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || '上传失败');
                }
                const result = await res.json();
                return result.content.path;
            } catch (err) {
                showToast('❌ 上传失败：' + err.message, 'error');
                return null;
            }
        }

        async function deleteFileFromGitHub(path, message = '删除文件') {
            const token = getToken();
            if (!token) return false;
            try {
                const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
                const getRes = await fetch(url, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (!getRes.ok) return false;
                const data = await getRes.json();
                const res = await fetch(url, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        sha: data.sha,
                        branch: 'main'
                    })
                });
                return res.ok;
            } catch (err) {
                return false;
            }
        }

        // ================================================================
        // 渲染
        // ================================================================
        function renderAll() {
            if (!configData) return;
            renderWorks();
            renderFriends();
            renderSettings();
            updateCounts();
        }

        function updateCounts() {
            $('worksCount').textContent = (configData.works || []).length + ' 个';
            $('friendsCount').textContent = (configData.friends || []).length + ' 条';
        }

        // ----- 作品 -----
        function renderWorks() {
            const container = $('worksList');
            const works = configData.works || [];
            if (works.length === 0) {
                container.innerHTML =
                    `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无作品，点击「添加作品」创建</div></div>`;
                return;
            }
            let html = '';
            works.forEach((work, index) => {
                const id = work.id || index;
                const isEnabled = work.enabled !== false;
                html += `
                        <div class="card-item" data-work-id="${id}">
                            <div class="card-info">
                                <div class="card-title">
                                    ${work.name || '未命名作品'}
                                    <span style="font-size:12px;font-weight:400;color:${isEnabled ? 'var(--success)' : 'var(--text-muted)'};">
                                        ${isEnabled ? '● 已上架' : '○ 已下架'}
                                    </span>
                                </div>
                                <div class="card-meta">${work.tags || '无标签'}</div>
                                <div class="card-desc">${work.desc || ''}</div>
                            </div>
                            <div class="card-actions">
                                <button class="toggle-switch ${isEnabled ? 'on' : ''}" data-work-id="${id}" title="${isEnabled ? '下架' : '上架'}">
                                    <span class="toggle-knob"></span>
                                </button>
                                <button class="btn btn-secondary btn-sm edit-work" data-work-id="${id}">✏️</button>
                                <button class="btn btn-danger btn-sm delete-work" data-work-id="${id}">🗑️</button>
                            </div>
                        </div>
                    `;
            });
            container.innerHTML = html;

            container.querySelectorAll('.toggle-switch').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleWorkEnabled(this.dataset.workId);
                });
            });
            container.querySelectorAll('.edit-work').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openWorkModal(this.dataset.workId);
                });
            });
            container.querySelectorAll('.delete-work').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    deleteWork(this.dataset.workId);
                });
            });
        }

        function toggleWorkEnabled(id) {
            const works = configData.works || [];
            const work = works.find(w => (w.id || works.indexOf(w)) == id);
            if (!work) return;
            work.enabled = work.enabled === false ? true : false;
            saveConfig().then(() => renderWorks());
        }

        function deleteWork(id) {
            if (!confirm('确定要删除这个作品吗？')) return;
            const works = configData.works || [];
            const index = works.findIndex(w => (w.id || works.indexOf(w)) == id);
            if (index === -1) return;
            works.splice(index, 1);
            saveConfig().then(() => renderWorks());
        }

        // ----- 朋友圈 -----
        function renderFriends() {
            const container = $('friendsList');
            const friends = configData.friends || [];
            if (friends.length === 0) {
                container.innerHTML =
                    `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无动态，点击「添加动态」发布</div></div>`;
                return;
            }
            const sorted = [...friends].sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return (b.id || '').localeCompare(a.id || '');
            });
            let html = '';
            sorted.forEach((friend, index) => {
                const id = friend.id || index;
                const pinnedTag = friend.pinned ? '<span class="pinned-tag">🔝 置顶</span>' : '';
                const contentPreview = (friend.content || '').slice(0, 60) + ((friend.content || '').length > 60 ?
                    '...' : '');
                const mediaCount = (friend.images || []).length + (friend.videos || []).length;
                const displayDate = formatDateToMinute(friend.date);
                html += `
                        <div class="card-item" data-friend-id="${id}">
                            <div class="card-info">
                                <div class="card-title">
                                    ${friend.title || '无标题'} ${pinnedTag}
                                </div>
                                <div class="card-meta">${displayDate} ${mediaCount > 0 ? '· 📎 ' + mediaCount + ' 个附件' : ''}</div>
                                <div class="card-desc">${contentPreview || '（空内容）'}</div>
                            </div>
                            <div class="card-actions">
                                <button class="btn btn-secondary btn-sm edit-friend" data-friend-id="${id}">✏️</button>
                                <button class="btn btn-danger btn-sm delete-friend" data-friend-id="${id}">🗑️</button>
                            </div>
                        </div>
                    `;
            });
            container.innerHTML = html;

            container.querySelectorAll('.edit-friend').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    openFriendModal(this.dataset.friendId);
                });
            });
            container.querySelectorAll('.delete-friend').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    deleteFriend(this.dataset.friendId);
                });
            });
        }

        function deleteFriend(id) {
            if (!confirm('确定要删除这条动态吗？')) return;
            const friends = configData.friends || [];
            const index = friends.findIndex(f => (f.id || friends.indexOf(f)) == id);
            if (index === -1) return;
            const friend = friends[index];
            if (friend.images) friend.images.forEach(img => deleteFileFromGitHub(img, '删除朋友圈图片'));
            if (friend.videos) friend.videos.forEach(vid => deleteFileFromGitHub(vid, '删除朋友圈视频'));
            friends.splice(index, 1);
            saveConfig().then(() => renderFriends());
        }

        // ----- 网站设置（关键修复） -----
        function renderSettings() {
            const site = configData.site || {};
            $('siteTitle').value = site.title || '';
            $('siteSubtitle').value = site.subtitle || '';
            $('siteSignature').value = site.signature || '';
            $('siteWechat').value = site.wechat || '';
            $('siteQQ').value = site.qq || '';

            // 头像
            const avatarPath = site.avatar || DEFAULT_AVATAR;
            $('avatarPreview').src = buildCdnUrl(avatarPath);
        }

        // ================================================================
        // 作品模态框
        // ================================================================
        function openWorkModal(id = null) {
            editingWorkId = id;
            $('workModalTitle').textContent = id !== null ? '✏️ 编辑作品' : '📦 添加作品';
            $('workModalSub').textContent = id !== null ? '修改作品信息' : '填写作品信息';
            $('workName').value = '';
            $('workTags').value = '';
            $('workDesc').value = '';
            $('workPrimary').value = '';
            $('workFallback').value = '';
            $('workCoverPreview').innerHTML = '';
            workCoverFile = null;
            $('workCoverStatus').textContent = '等待上传...';
            $('workCoverStatus').className = 'upload-status';

            if (id !== null) {
                const works = configData.works || [];
                const work = works.find(w => (w.id || works.indexOf(w)) == id);
                if (work) {
                    $('workName').value = work.name || '';
                    $('workTags').value = work.tags || '';
                    $('workDesc').value = work.desc || '';
                    $('workPrimary').value = work.primaryLink || '';
                    $('workFallback').value = work.fallbackLink || '';
                    if (work.cover) {
                        const div = document.createElement('div');
                        div.className = 'preview-item';
                        const img = document.createElement('img');
                        img.src = buildCdnUrl(work.cover);
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'cover';
                        div.appendChild(img);
                        $('workCoverPreview').appendChild(div);
                        $('workCoverStatus').textContent = '✅ 当前封面';
                        $('workCoverStatus').className = 'upload-status success';
                    }
                }
            }
            $('workModal').classList.add('active');
        }

        $('workModalCancel').addEventListener('click', () => {
            $('workModal').classList.remove('active');
            editingWorkId = null;
            workCoverFile = null;
        });

        $('workModalSave').addEventListener('click', async () => {
            const name = $('workName').value.trim();
            const tags = $('workTags').value.trim();
            const desc = $('workDesc').value.trim();
            const primaryLink = $('workPrimary').value.trim();
            const fallbackLink = $('workFallback').value.trim();

            if (!name) { showToast('⚠️ 请填写作品名称', 'error'); return; }
            if (!fallbackLink) { showToast('⚠️ 请填写 GitHub 链接', 'error'); return; }

            const works = configData.works || [];
            let work;
            if (editingWorkId !== null) {
                work = works.find(w => (w.id || works.indexOf(w)) == editingWorkId);
                if (!work) { showToast('⚠️ 作品不存在', 'error'); return; }
            } else {
                work = { id: generateId(), enabled: true };
                works.push(work);
            }

            work.name = name;
            work.tags = tags;
            work.desc = desc;
            work.primaryLink = primaryLink || '';
            work.fallbackLink = fallbackLink;

            if (workCoverFile) {
                const ext = workCoverFile.name.split('.').pop().toLowerCase();
                const filename = `cover-${Date.now()}.${ext}`;
                const path = `images/works/${filename}`;
                const base64 = await readFileAsBase64(workCoverFile);
                const uploadedPath = await uploadFileToGitHub(path, base64, `上传封面: ${filename}`);
                if (uploadedPath) {
                    if (work.cover) await deleteFileFromGitHub(work.cover, '删除旧封面');
                    work.cover = uploadedPath;
                }
                workCoverFile = null;
            }

            configData.works = works;
            await saveConfig();
            $('workModal').classList.remove('active');
            editingWorkId = null;
            renderWorks();
            showToast('✅ 作品已保存');
        });

        $('workCoverUpload').addEventListener('click', () => $('workCoverInput').click());
        $('workCoverInput').addEventListener('change', (e) => {
            if (e.target.files.length) {
                workCoverFile = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    $('workCoverPreview').innerHTML = '';
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    img.style.width = '100%';
                    img.style.height = '100%';
                    img.style.objectFit = 'cover';
                    div.appendChild(img);
                    $('workCoverPreview').appendChild(div);
                    $('workCoverStatus').textContent = '✅ 已选择: ' + workCoverFile.name;
                    $('workCoverStatus').className = 'upload-status success';
                };
                reader.readAsDataURL(workCoverFile);
            }
        });

        // ================================================================
        // 朋友圈模态框
        // ================================================================
        function openFriendModal(id = null) {
            editingFriendId = id;
            $('friendModalTitle').textContent = id !== null ? '✏️ 编辑动态' : '📝 添加动态';
            $('friendModalSub').textContent = id !== null ? '修改动态内容' : '填写动态内容';
            $('friendTitle').value = '';
            $('friendContent').value = '';
            $('friendMediaPreview').innerHTML = '';
            friendMediaFiles = [];
            $('friendMediaStatus').textContent = '等待上传...';
            $('friendMediaStatus').className = 'upload-status';
            $('friendPinnedToggle').classList.remove('on');
            $('friendPinnedLabel').textContent = '未置顶';

            if (id !== null) {
                const friends = configData.friends || [];
                const friend = friends.find(f => (f.id || friends.indexOf(f)) == id);
                if (friend) {
                    $('friendTitle').value = friend.title || '';
                    $('friendContent').value = friend.content || '';
                    if (friend.pinned) {
                        $('friendPinnedToggle').classList.add('on');
                        $('friendPinnedLabel').textContent = '已置顶';
                    }
                    const allMedia = [...(friend.images || []), ...(friend.videos || [])];
                    allMedia.forEach(url => {
                        const div = document.createElement('div');
                        div.className = 'preview-item';
                        const isVideo = url.match(/\.(mp4|mov|webm)$/i);
                        if (isVideo) {
                            const vid = document.createElement('video');
                            vid.src = buildCdnUrl(url);
                            vid.style.width = '100%';
                            vid.style.height = '100%';
                            vid.style.objectFit = 'cover';
                            div.appendChild(vid);
                        } else {
                            const img = document.createElement('img');
                            img.src = buildCdnUrl(url);
                            img.style.width = '100%';
                            img.style.height = '100%';
                            img.style.objectFit = 'cover';
                            div.appendChild(img);
                        }
                        $('friendMediaPreview').appendChild(div);
                    });
                    if (allMedia.length > 0) {
                        $('friendMediaStatus').textContent = '✅ ' + allMedia.length + ' 个已有附件';
                        $('friendMediaStatus').className = 'upload-status success';
                    }
                }
            }
            $('friendModal').classList.add('active');
        }

        $('friendModalCancel').addEventListener('click', () => {
            $('friendModal').classList.remove('active');
            editingFriendId = null;
            friendMediaFiles = [];
        });

        $('friendPinnedToggle').addEventListener('click', function() {
            this.classList.toggle('on');
            $('friendPinnedLabel').textContent = this.classList.contains('on') ? '已置顶' : '未置顶';
        });

        $('friendModalSave').addEventListener('click', async () => {
            const title = $('friendTitle').value.trim();
            const content = $('friendContent').value.trim();
            if (!title) { showToast('⚠️ 请填写标题', 'error'); return; }

            const friends = configData.friends || [];
            let friend;
            if (editingFriendId !== null) {
                friend = friends.find(f => (f.id || friends.indexOf(f)) == editingFriendId);
                if (!friend) { showToast('⚠️ 动态不存在', 'error'); return; }
            } else {
                friend = {
                    id: generateId(),
                    date: getCurrentTimeMinute(),
                    pinned: false,
                    images: [],
                    videos: []
                };
                friends.push(friend);
            }

            friend.title = title;
            friend.content = content;
            friend.pinned = $('friendPinnedToggle').classList.contains('on');

            const newImages = [];
            const newVideos = [];
            for (const file of friendMediaFiles) {
                const ext = file.name.split('.').pop().toLowerCase();
                const isVideo = file.type.startsWith('video/');
                const filename = `media-${Date.now()}-${Math.random().toString(36).slice(2,6)}.${ext}`;
                const path = `images/friends/${filename}`;
                const base64 = await readFileAsBase64(file);
                const uploadedPath = await uploadFileToGitHub(path, base64, `上传朋友圈媒体: ${filename}`);
                if (uploadedPath) {
                    if (isVideo) newVideos.push(uploadedPath);
                    else newImages.push(uploadedPath);
                }
            }
            if (newImages.length) friend.images = [...(friend.images || []), ...newImages];
            if (newVideos.length) friend.videos = [...(friend.videos || []), ...newVideos];

            configData.friends = friends;
            await saveConfig();
            $('friendModal').classList.remove('active');
            editingFriendId = null;
            friendMediaFiles = [];
            renderFriends();
            showToast('✅ 动态已保存');
        });

        $('friendMediaUpload').addEventListener('click', () => $('friendMediaInput').click());
        $('friendMediaInput').addEventListener('change', (e) => {
            if (e.target.files.length) {
                for (const file of e.target.files) {
                    friendMediaFiles.push(file);
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const div = document.createElement('div');
                        div.className = 'preview-item';
                        if (file.type.startsWith('video/')) {
                            const vid = document.createElement('video');
                            vid.src = ev.target.result;
                            vid.style.width = '100%';
                            vid.style.height = '100%';
                            vid.style.objectFit = 'cover';
                            vid.muted = true;
                            div.appendChild(vid);
                        } else {
                            const img = document.createElement('img');
                            img.src = ev.target.result;
                            img.style.width = '100%';
                            img.style.height = '100%';
                            img.style.objectFit = 'cover';
                            div.appendChild(img);
                        }
                        $('friendMediaPreview').appendChild(div);
                    };
                    reader.readAsDataURL(file);
                }
                $('friendMediaStatus').textContent = '✅ 已选择 ' + friendMediaFiles.length + ' 个文件';
                $('friendMediaStatus').className = 'upload-status success';
            }
        });

        // ================================================================
        // 头像上传（自动删旧）
        // ================================================================
        $('avatarUploadBtn').addEventListener('click', () => $('avatarFileInput').click());
        $('avatarFileInput').addEventListener('change', async (e) => {
            if (!e.target.files.length) return;
            const file = e.target.files[0];
            const status = $('avatarUploadStatus');
            status.textContent = '⏳ 上传中...';
            status.className = 'upload-status';

            try {
                const ext = file.name.split('.').pop().toLowerCase();
                const filename = `avatar-${Date.now()}.${ext}`;
                const path = `images/avatar/${filename}`;
                const base64 = await readFileAsBase64(file);
                const uploadedPath = await uploadFileToGitHub(path, base64, `上传头像: ${filename}`);
                if (!uploadedPath) {
                    status.textContent = '❌ 上传失败';
                    status.className = 'upload-status error';
                    return;
                }

                const oldPath = configData.site?.avatar;
                if (oldPath && oldPath !== DEFAULT_AVATAR && !oldPath.startsWith('http')) {
                    await deleteFileFromGitHub(oldPath, '删除旧头像');
                }

                if (!configData.site) configData.site = {};
                configData.site.avatar = uploadedPath;
                await saveConfig();

                $('avatarPreview').src = buildCdnUrl(uploadedPath);
                status.textContent = '✅ 头像已更新，旧头像已删除';
                status.className = 'upload-status success';
                showToast('✅ 头像已更换');
            } catch (err) {
                status.textContent = '❌ ' + err.message;
                status.className = 'upload-status error';
            }
        });

        // ================================================================
        // 签名图片上传
        // ================================================================
        $('signatureUpload').addEventListener('click', () => $('signatureFileInput').click());
        $('signatureFileInput').addEventListener('change', async (e) => {
            if (!e.target.files.length) return;
            const file = e.target.files[0];
            const status = $('signatureUploadStatus');
            status.textContent = '⏳ 上传中...';
            status.className = 'upload-status';

            try {
                const ext = file.name.split('.').pop().toLowerCase();
                const filename = `sig-${Date.now()}.${ext}`;
                const path = `images/signature/${filename}`;
                const base64 = await readFileAsBase64(file);
                const uploadedPath = await uploadFileToGitHub(path, base64, `上传签名图片: ${filename}`);
                if (!uploadedPath) {
                    status.textContent = '❌ 上传失败';
                    status.className = 'upload-status error';
                    return;
                }
                const cdnUrl = buildCdnUrl(uploadedPath);
                const textarea = $('siteSignature');
                const cursorPos = textarea.selectionStart || textarea.value.length;
                const markdown = `![](${cdnUrl})`;
                textarea.value = textarea.value.substring(0, cursorPos) + markdown + textarea.value.substring(cursorPos);
                status.textContent = '✅ 已插入图片链接';
                status.className = 'upload-status success';
            } catch (err) {
                status.textContent = '❌ ' + err.message;
                status.className = 'upload-status error';
            }
        });

        // ================================================================
        // 保存网站设置（修复：读取表单→更新 configData→保存→重新渲染）
        // ================================================================
        $('saveSettingsBtn').addEventListener('click', async () => {
            if (!configData.site) configData.site = {};

            configData.site.title = $('siteTitle').value.trim();
            configData.site.subtitle = $('siteSubtitle').value.trim();
            configData.site.signature = $('siteSignature').value.trim();
            configData.site.wechat = $('siteWechat').value.trim();
            configData.site.qq = $('siteQQ').value.trim();

            await saveConfig();
            // 重新渲染设置面板，确保表单显示最新数据
            renderSettings();
            showToast('✅ 设置已保存');
        });

        // ================================================================
        // Tab 切换
        // ================================================================
        document.querySelectorAll('#tabNav .tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('#tabNav .tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                const target = this.dataset.tab;
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                document.getElementById('panel' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add(
                    'active');
            });
        });

        // ================================================================
        // 添加按钮
        // ================================================================
        $('addWorkBtn').addEventListener('click', () => openWorkModal(null));
        $('addFriendBtn').addEventListener('click', () => openFriendModal(null));

        // ================================================================
        // 模态框外部关闭
        // ================================================================
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay.active').forEach(el => el.classList.remove('active'));
            }
        });

        // ================================================================
        // 启动
        // ================================================================
        loadConfig().then(() => {
            if (!getToken()) {
                setTimeout(() => {
                    $('tokenModal').classList.add('active');
                    $('tokenHint').textContent = '💡 请配置 GitHub Token 以读写数据';
                }, 500);
            }
        });

        console.log('🦔 CiweiManager 已启动 (修复版)');
        console.log('📦 仓库:', REPO);
        console.log('📄 配置文件:', CONFIG_PATH);
    </script>

</body>
</html>
