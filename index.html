<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CiweiManager · 内容管理后台</title>

    <!-- ===== Google Font ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           深色/浅色模式 CSS 变量
           ============================================================ */
        :root {
            /* 浅色模式（默认） */
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.75);
            --bg-glass: rgba(255, 255, 255, 0.55);
            --bg-input: rgba(255, 255, 255, 0.7);
            --bg-hover: rgba(0, 0, 0, 0.04);
            --text-primary: #1a1a2e;
            --text-secondary: #555;
            --text-muted: #999;
            --text-faint: #bbb;
            --border-color: #e0e4ec;
            --border-light: rgba(0, 0, 0, 0.06);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.12);
            --accent: #1a1a2e;
            --accent-hover: #2d2d4a;
            --accent-text: #ffffff;
            --green: #22c55e;
            --red: #ef4444;
            --orange: #f59e0b;
            --blue: #3b82f6;
            --glass-border: rgba(255, 255, 255, 0.6);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* 深色模式 */
        [data-theme="dark"] {
            --bg-primary: #0a0a0f;
            --bg-secondary: #141420;
            --bg-card: rgba(20, 20, 32, 0.8);
            --bg-glass: rgba(20, 20, 32, 0.5);
            --bg-input: rgba(255, 255, 255, 0.06);
            --bg-hover: rgba(255, 255, 255, 0.06);
            --text-primary: #f0f4ff;
            --text-secondary: #b0b8d0;
            --text-muted: #777;
            --text-faint: #555;
            --border-color: #2a2a3e;
            --border-light: rgba(255, 255, 255, 0.06);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);
            --accent: #58a6ff;
            --accent-hover: #79b8ff;
            --accent-text: #0a0a0f;
            --glass-border: rgba(255, 255, 255, 0.06);
        }

        /* 跟随系统 */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]):not([data-theme="dark"]) {
                --bg-primary: #0a0a0f;
                --bg-secondary: #141420;
                --bg-card: rgba(20, 20, 32, 0.8);
                --bg-glass: rgba(20, 20, 32, 0.5);
                --bg-input: rgba(255, 255, 255, 0.06);
                --bg-hover: rgba(255, 255, 255, 0.06);
                --text-primary: #f0f4ff;
                --text-secondary: #b0b8d0;
                --text-muted: #777;
                --text-faint: #555;
                --border-color: #2a2a3e;
                --border-light: rgba(255, 255, 255, 0.06);
                --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.4);
                --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);
                --accent: #58a6ff;
                --accent-hover: #79b8ff;
                --accent-text: #0a0a0f;
                --glass-border: rgba(255, 255, 255, 0.06);
            }
        }

        /* ============================================================
           全局
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, 'PingFang SC', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 16px 60px;
            transition: background var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
        }

        /* ============================================================
           容器
           ============================================================ */
        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        /* ============================================================
           顶部导航
           ============================================================ */
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
            transition: border-color var(--transition);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav-left .logo {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
            transition: color var(--transition);
        }

        .nav-left .logo span {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 14px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ===== 主题切换按钮 ===== */
        .theme-toggle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .theme-toggle:hover {
            background: var(--bg-hover);
            border-color: var(--text-muted);
            transform: scale(1.04);
        }

        .theme-toggle:active {
            transform: scale(0.92);
        }

        /* ===== Token 状态 ===== */
        .token-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all var(--transition);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-secondary);
        }

        .token-status:hover {
            background: var(--bg-hover);
        }

        .token-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: background var(--transition);
        }

        .token-status .dot.active {
            background: var(--green);
        }

        .token-status .dot.inactive {
            background: var(--text-faint);
        }

        /* ============================================================
           标签页
           ============================================================ */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            background: var(--bg-glass);
            border-radius: 14px;
            padding: 4px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow-x: auto;
            transition: background var(--transition), border-color var(--transition);
        }

        .tab-btn {
            flex: 1;
            min-width: 80px;
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .tab-btn.active {
            background: var(--accent);
            color: var(--accent-text);
            box-shadow: 0 4px 16px rgba(26, 26, 46, 0.15);
        }

        [data-theme="dark"] .tab-btn.active {
            box-shadow: 0 4px 24px rgba(88, 166, 255, 0.2);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.35s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           卡片
           ============================================================ */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 20px 22px;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .card-header h3 {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            transition: color var(--transition);
        }

        .card-header .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ============================================================
           按钮
           ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 20px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            touch-action: manipulation;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.94);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--accent-text);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 26, 46, 0.2);
        }

        [data-theme="dark"] .btn-primary:hover {
            box-shadow: 0 8px 24px rgba(88, 166, 255, 0.25);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            background: var(--bg-hover);
            border-color: var(--text-muted);
        }

        .btn-danger {
            background: var(--red);
            color: #fff;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.25);
        }

        .btn-success {
            background: var(--green);
            color: #fff;
        }

        .btn-success:hover {
            background: #16a34a;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.25);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }

        .btn-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 15px;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-icon.danger:hover {
            color: var(--red);
            background: rgba(239, 68, 68, 0.1);
        }

        .btn-icon.success:hover {
            color: var(--green);
            background: rgba(34, 197, 94, 0.1);
        }

        /* ============================================================
           列表项
           ============================================================ */
        .list-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-light);
            transition: border-color var(--transition);
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item .info {
            flex: 1;
            min-width: 0;
        }

        .list-item .info .title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            transition: color var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .list-item .info .title .pinned-tag {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-glass);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            letter-spacing: 0.3px;
        }

        .list-item .info .meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            transition: color var(--transition);
        }

        .list-item .info .desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
            line-height: 1.5;
            transition: color var(--transition);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .list-item .status {
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 20px;
            transition: all var(--transition);
        }

        .list-item .status.on {
            color: var(--green);
            background: rgba(34, 197, 94, 0.12);
        }

        .list-item .status.off {
            color: var(--text-muted);
            background: var(--bg-glass);
        }

        .list-item .actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
            margin-left: 4px;
        }

        /* ============================================================
           开关（Toggle）
           ============================================================ */
        .toggle-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex-shrink: 0;
            user-select: none;
        }

        .toggle-track {
            width: 44px;
            height: 24px;
            border-radius: 12px;
            background: var(--text-faint);
            transition: all var(--transition);
            position: relative;
            flex-shrink: 0;
            cursor: pointer;
        }

        .toggle-track .thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: all var(--transition);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .toggle-track.active {
            background: var(--accent);
        }

        .toggle-track.active .thumb {
            left: 23px;
        }

        .toggle-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            transition: color var(--transition);
        }

        /* ============================================================
           表单
           ============================================================ */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 5px;
            transition: color var(--transition);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: all var(--transition);
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-group .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            transition: color var(--transition);
        }

        /* ============================================================
           上传区域（复用 write.html 风格）
           ============================================================ */
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 24px 16px;
            text-align: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: all var(--transition);
            background: var(--bg-glass);
        }

        .upload-area:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            border-color: var(--accent);
            background: var(--bg-hover);
            transform: scale(1.01);
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-area .icon {
            font-size: 32px;
            margin-bottom: 6px;
        }

        .upload-area .sub {
            font-size: 12px;
            color: var(--text-faint);
        }

        .upload-status {
            font-size: 13px;
            margin-top: 8px;
            min-height: 20px;
            color: var(--text-muted);
            transition: color var(--transition);
        }

        .upload-status .success {
            color: var(--green);
        }

        .upload-status .error {
            color: var(--red);
        }

        /* ============================================================
           头像预览
           ============================================================ */
        .avatar-preview-wrap {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 8px 0;
        }

        .avatar-preview {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--border-color);
            flex-shrink: 0;
            background: var(--bg-glass);
            transition: border-color var(--transition);
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .avatar-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ============================================================
           模态框
           ============================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 28px 26px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--glass-border);
            animation: scaleIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            transition: background var(--transition), border-color var(--transition);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.92);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-box .modal-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            transition: color var(--transition);
        }

        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* ============================================================
           空状态 & 加载
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            transition: color var(--transition);
        }

        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .loading-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            transition: color var(--transition);
        }

        .loading-state .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
           Toast
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--glass-border);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
            z-index: 9999;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            border-color: var(--red);
            color: var(--red);
        }

        .toast.success {
            border-color: var(--green);
            color: var(--green);
        }

        /* ============================================================
           响应式
           ============================================================ */
        @media (max-width: 640px) {
            body {
                padding: 12px 10px 40px;
            }

            .nav {
                padding: 8px 0 14px;
                gap: 8px;
            }

            .nav-left .logo {
                font-size: 18px;
            }

            .nav-left .logo span {
                font-size: 12px;
            }

            .nav-right .token-status {
                padding: 6px 12px;
                font-size: 11px;
            }

            .nav-right .token-status .dot {
                width: 6px;
                height: 6px;
            }

            .card {
                padding: 14px 14px;
            }

            .card-header h3 {
                font-size: 15px;
            }

            .list-item {
                flex-wrap: wrap;
                gap: 8px;
            }

            .list-item .actions {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
            }

            .list-item .status {
                font-size: 11px;
                padding: 2px 10px;
            }

            .modal-box {
                padding: 20px 16px;
            }

            .tab-btn {
                font-size: 12px;
                padding: 8px 12px;
                min-width: 60px;
            }

            .theme-toggle {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }

            .avatar-preview-wrap {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 400px) {
            .nav-left .logo span {
                display: none;
            }

            .tabs {
                gap: 2px;
                padding: 2px;
            }

            .tab-btn {
                font-size: 11px;
                padding: 6px 8px;
                min-width: 50px;
            }
        }

        /* ============================================================
           滚动条
           ============================================================ */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--text-faint);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ============================================================
        顶部导航
        ============================================================ -->
        <nav class="nav">
            <div class="nav-left">
                <div class="logo">
                    🦔 CiweiManager
                    <span>内容控制台</span>
                </div>
            </div>
            <div class="nav-right">
                <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">
                    🌙
                </button>
                <div class="token-status" id="tokenStatus" title="点击配置 GitHub Token">
                    <span class="dot inactive" id="tokenDot"></span>
                    <span id="tokenLabel">未配置</span>
                </div>
            </div>
        </nav>

        <!-- ============================================================
        Token 配置弹窗（内联简化版）
        ============================================================ -->
        <div class="modal-overlay" id="tokenModal">
            <div class="modal-box">
                <div class="modal-title">🔑 GitHub Token</div>
                <div class="form-group">
                    <label>输入你的 GitHub Personal Access Token</label>
                    <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
                    <div class="hint" id="tokenHint">Token 仅保存在浏览器 localStorage 中，用于读写 config.json</div>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-outline btn-sm" onclick="clearToken()">清除</button>
                    <button class="btn btn-primary btn-sm" onclick="saveToken()">保存</button>
                </div>
            </div>
        </div>

        <!-- ============================================================
        标签页
        ============================================================ -->
        <div class="tabs" id="tabs">
            <button class="tab-btn active" data-tab="works">📦 作品</button>
            <button class="tab-btn" data-tab="friends">📝 朋友圈</button>
            <button class="tab-btn" data-tab="settings">⚙️ 设置</button>
        </div>

        <!-- ============================================================
        TAB 1：作品管理
        ============================================================ -->
        <div class="tab-content active" id="tab-works">
            <div class="card">
                <div class="card-header">
                    <h3>📦 作品管理</h3>
                    <div class="actions">
                        <button class="btn btn-primary btn-sm" onclick="openAddWork()">+ 添加作品</button>
                        <button class="btn btn-outline btn-sm" onclick="loadAllData()">🔄 刷新</button>
                    </div>
                </div>
                <div id="worksList">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <div>加载中...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============================================================
        TAB 2：朋友圈管理
        ============================================================ -->
        <div class="tab-content" id="tab-friends">
            <div class="card">
                <div class="card-header">
                    <h3>📝 朋友圈管理</h3>
                    <div class="actions">
                        <button class="btn btn-primary btn-sm" onclick="openAddFriend()">+ 添加动态</button>
                        <button class="btn btn-outline btn-sm" onclick="loadAllData()">🔄 刷新</button>
                    </div>
                </div>
                <div id="friendsList">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <div>加载中...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============================================================
        TAB 3：网站设置
        ============================================================ -->
        <div class="tab-content" id="tab-settings">
            <div class="card">
                <div class="card-header">
                    <h3>⚙️ 网站设置</h3>
                    <button class="btn btn-primary btn-sm" onclick="saveSettings()">💾 保存设置</button>
                </div>

                <div class="form-group">
                    <label>网站标题</label>
                    <input type="text" id="setTitle" placeholder="🦔 刺猬的家">
                </div>

                <div class="form-group">
                    <label>副标题</label>
                    <input type="text" id="setSubtitle" placeholder="独立开发者">
                </div>

                <div class="form-group">
                    <label>个性签名（支持 Markdown，图片用 ![](url)）</label>
                    <textarea id="setSignature" rows="4" placeholder="写一段介绍自己或网站的话..."></textarea>
                </div>

                <div class="form-group">
                    <label>头像</label>
                    <div class="avatar-preview-wrap">
                        <div class="avatar-preview" id="avatarPreview">
                            <img id="avatarImg" src="" alt="头像">
                        </div>
                        <div class="avatar-actions">
                            <button class="btn btn-outline btn-sm" onclick="document.getElementById('avatarInput').click()">📤 更换头像</button>
                            <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarChange(event)">
                            <span style="font-size:12px;color:var(--text-muted);">支持 jpg, png, webp</span>
                        </div>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                    <div class="form-group">
                        <label>微信</label>
                        <input type="text" id="setWechat" placeholder="微信号">
                    </div>
                    <div class="form-group">
                        <label>QQ</label>
                        <input type="text" id="setQq" placeholder="QQ号">
                    </div>
                </div>

                <div style="margin-top:8px;padding:12px 16px;background:var(--bg-glass);border-radius:10px;border:1px solid var(--border-light);font-size:13px;color:var(--text-muted);">
                    💡 所有设置保存后会自动更新到 <code>config.json</code>，主站 <code>CiweiHome</code> 会实时同步。
                </div>
            </div>
        </div>

        <!-- ============================================================
        Toast
        ============================================================ -->
        <div class="toast" id="toast"></div>

        <!-- ============================================================
        模态框（作品/朋友圈 共用）
        ============================================================ -->
        <div class="modal-overlay" id="formModal">
            <div class="modal-box">
                <div class="modal-title" id="formTitle">添加作品</div>
                <div id="formBody"></div>
                <div class="modal-actions">
                    <button class="btn btn-outline btn-sm" onclick="closeFormModal()">取消</button>
                    <button class="btn btn-primary btn-sm" id="formSubmitBtn" onclick="submitForm()">确认</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ================================================================
        // 配置
        // ================================================================
        const REPO = 'xiaociwei01/CiweiManager';
        const CONFIG_PATH = 'config.json';
        const STORAGE_KEY = 'ciwei_manager_token';
        const THEME_KEY = 'ciwei_manager_theme';

        // ================================================================
        // 状态
        // ================================================================
        let token = '';
        let configData = null; // 完整的 config.json 对象
        let formMode = 'add'; // 'add' | 'edit'
        let formType = 'work'; // 'work' | 'friend'
        let editId = null;
        let isSaving = false;

        // ================================================================
        // DOM 引用
        // ================================================================
        const $ = id => document.getElementById(id);
        const toast = $('toast');
        let toastTimer = null;

        // ================================================================
        // Toast
        // ================================================================
        function showToast(msg, type = 'success') {
            toast.textContent = msg;
            toast.className = 'toast ' + type;
            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
        }

        // ================================================================
        // 主题切换
        // ================================================================
        function initTheme() {
            const saved = localStorage.getItem(THEME_KEY);
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            let theme = 'light';
            if (saved === 'dark' || saved === 'light') {
                theme = saved;
            } else if (prefersDark) {
                theme = 'dark';
            }

            applyTheme(theme);
            updateThemeIcon(theme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem(THEME_KEY, theme);
        }

        function updateThemeIcon(theme) {
            const btn = $('themeToggle');
            btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        $('themeToggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            updateThemeIcon(next);
        });

        // 监听系统主题变化
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem(THEME_KEY)) {
                const theme = e.matches ? 'dark' : 'light';
                applyTheme(theme);
                updateThemeIcon(theme);
            }
        });

        // ================================================================
        // Token 管理
        // ================================================================
        function loadToken() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved && saved.startsWith('ghp_')) {
                token = saved;
                $('tokenInput').value = saved;
                $('tokenDot').className = 'dot active';
                $('tokenLabel').textContent = '已配置';
                $('tokenHint').textContent = '✅ Token 已配置';
                return true;
            }
            token = '';
            $('tokenDot').className = 'dot inactive';
            $('tokenLabel').textContent = '未配置';
            $('tokenHint').textContent = '⚠️ 请配置 Token 以读写数据';
            return false;
        }

        function saveToken() {
            const val = $('tokenInput').value.trim();
            if (val && val.startsWith('ghp_')) {
                localStorage.setItem(STORAGE_KEY, val);
                token = val;
                $('tokenDot').className = 'dot active';
                $('tokenLabel').textContent = '已配置';
                $('tokenHint').textContent = '✅ Token 已配置';
                $('tokenModal').classList.remove('active');
                showToast('✅ Token 已保存');
                loadAllData();
            } else if (!val) {
                clearToken();
            } else {
                $('tokenHint').textContent = '⚠️ Token 格式错误，应以 ghp_ 开头';
                showToast('⚠️ Token 格式错误', 'error');
            }
        }

        function clearToken() {
            localStorage.removeItem(STORAGE_KEY);
            token = '';
            $('tokenInput').value = '';
            $('tokenDot').className = 'dot inactive';
            $('tokenLabel').textContent = '未配置';
            $('tokenHint').textContent = '⚠️ 请配置 Token 以读写数据';
            $('tokenModal').classList.remove('active');
            showToast('Token 已清除');
        }

        $('tokenStatus').addEventListener('click', () => {
            $('tokenModal').classList.add('active');
            $('tokenInput').focus();
        });

        $('tokenInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') saveToken();
        });

        $('tokenModal').addEventListener('click', (e) => {
            if (e.target === $('tokenModal')) $('tokenModal').classList.remove('active');
        });

        // ================================================================
        // 标签页切换
        // ================================================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                const target = $('tab-' + btn.dataset.tab);
                if (target) target.classList.add('active');
            });
        });

        // ================================================================
        // 加载 config.json
        // ================================================================
        async function loadConfig() {
            const url = `https://raw.githubusercontent.com/${REPO}/main/${CONFIG_PATH}?t=${Date.now()}`;
            try {
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                configData = data;
                return data;
            } catch (err) {
                console.warn('加载 config.json 失败，尝试 CDN...', err);
                // 回退 CDN
                const cdnUrl = `https://cdn.jsdelivr.net/gh/${REPO}@main/${CONFIG_PATH}?t=${Date.now()}`;
                const res2 = await fetch(cdnUrl, { cache: 'no-store' });
                if (!res2.ok) throw new Error('CDN 加载失败');
                const data = await res2.json();
                configData = data;
                return data;
            }
        }

        // ================================================================
        // 保存 config.json（通过 GitHub API）
        // ================================================================
        async function saveConfig(data) {
            if (!token) {
                showToast('⚠️ 请先配置 GitHub Token', 'error');
                $('tokenModal').classList.add('active');
                return false;
            }

            try {
                // 先获取当前文件的 SHA
                const url = `https://api.github.com/repos/${REPO}/contents/${CONFIG_PATH}`;
                let sha = '';
                try {
                    const getRes = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
                    if (getRes.ok) {
                        const fileData = await getRes.json();
                        sha = fileData.sha;
                    }
                } catch (e) {}

                const content = JSON.stringify(data, null, 2);
                const payload = {
                    message: `更新配置: ${new Date().toLocaleString()}`,
                    content: btoa(unescape(encodeURIComponent(content))),
                    branch: 'main'
                };
                if (sha) payload.sha = sha;

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!putRes.ok) {
                    const err = await putRes.json();
                    throw new Error(err.message || '保存失败');
                }

                configData = data;
                return true;
            } catch (err) {
                showToast(`❌ 保存失败：${err.message}`, 'error');
                return false;
            }
        }

        // ================================================================
        // 加载所有数据并渲染
        // ================================================================
        async function loadAllData() {
            try {
                const data = await loadConfig();
                renderWorks(data.works || []);
                renderFriends(data.friends || []);
                renderSettings(data.site || {});
            } catch (err) {
                showToast('❌ 加载数据失败，请检查网络或 Token', 'error');
                $('worksList').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><div>加载失败，请刷新重试</div></div>`;
                $('friendsList').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><div>加载失败，请刷新重试</div></div>`;
            }
        }

        // ================================================================
        // 渲染：作品列表
        // ================================================================
        function renderWorks(works) {
            const container = $('worksList');
            if (!works || works.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div>还没有作品，点击「添加作品」创建</div></div>`;
                return;
            }

            let html = '';
            works.forEach((work, index) => {
                const isOn = work.enabled !== false;
                html += `
                    <div class="list-item" data-id="${work.id || index}">
                        <div class="info">
                            <div class="title">
                                ${work.cover ? `<span style="font-size:18px;line-height:1;">${work.cover.match(/\.(jpg|png|webp)$/i) ? '🖼️' : '📎'}</span>` : '📄'}
                                ${work.name || '未命名'}
                                <span class="status ${isOn ? 'on' : 'off'}">${isOn ? '● 已上架' : '○ 已下架'}</span>
                            </div>
                            <div class="desc">${work.desc || '无描述'}</div>
                            <div class="meta">${work.tags || ''} ${work.primaryLink ? '🔗 ' + work.primaryLink.replace(/^https?:\/\//, '') : ''}</div>
                        </div>
                        <div class="actions">
                            <div class="toggle-wrap" onclick="toggleWork(${index})">
                                <div class="toggle-track ${isOn ? 'active' : ''}">
                                    <div class="thumb"></div>
                                </div>
                            </div>
                            <button class="btn-icon" onclick="openEditWork(${index})" title="编辑">✏️</button>
                            <button class="btn-icon danger" onclick="deleteWork(${index})" title="删除">🗑️</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ================================================================
        // 渲染：朋友圈列表
        // ================================================================
        function renderFriends(friends) {
            const container = $('friendsList');
            if (!friends || friends.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div>还没有朋友圈动态，点击「添加动态」创建</div></div>`;
                return;
            }

            // 置顶优先
            const sorted = [...friends].sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return (b.date || '').localeCompare(a.date || '');
            });

            let html = '';
            sorted.forEach((item, index) => {
                const origIndex = friends.indexOf(item);
                const isPinned = item.pinned === true;
                html += `
                    <div class="list-item" data-id="${item.id || index}">
                        <div class="info">
                            <div class="title">
                                ${isPinned ? '<span class="pinned-tag">🔝 置顶</span>' : ''}
                                ${item.title || '无标题'}
                            </div>
                            <div class="meta">${item.date || '未知日期'} ${item.images && item.images.length ? '📷 ' + item.images.length + '张' : ''} ${item.videos && item.videos.length ? '🎬 ' + item.videos.length + '个' : ''}</div>
                            <div class="desc">${(item.content || '').replace(/\n/g, ' ').substring(0, 80)}${(item.content || '').length > 80 ? '...' : ''}</div>
                        </div>
                        <div class="actions">
                            <button class="btn-icon success" onclick="toggleFriendPin(${origIndex})" title="${isPinned ? '取消置顶' : '置顶'}">📌</button>
                            <button class="btn-icon" onclick="openEditFriend(${origIndex})" title="编辑">✏️</button>
                            <button class="btn-icon danger" onclick="deleteFriend(${origIndex})" title="删除">🗑️</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ================================================================
        // 渲染：设置
        // ================================================================
        function renderSettings(site) {
            $('setTitle').value = site.title || '';
            $('setSubtitle').value = site.subtitle || '';
            $('setSignature').value = site.signature || '';
            $('setWechat').value = site.wechat || '';
            $('setQq').value = site.qq || '';

            // 头像
            if (site.avatar) {
                const avatarUrl = `https://cdn.jsdelivr.net/gh/${REPO}@main/${site.avatar}`;
                $('avatarImg').src = avatarUrl;
            } else {
                $('avatarImg').src = '';
            }
        }

        // ================================================================
        // 作品操作：切换上下架
        // ================================================================
        async function toggleWork(index) {
            if (!configData || !configData.works) return;
            const work = configData.works[index];
            if (!work) return;
            work.enabled = work.enabled === false ? true : false;
            const ok = await saveConfig(configData);
            if (ok) {
                renderWorks(configData.works);
                showToast(work.enabled ? '✅ 已上架' : '✅ 已下架');
            } else {
                // 回滚
                work.enabled = !work.enabled;
            }
        }

        // ================================================================
        // 作品操作：删除
        // ================================================================
        async function deleteWork(index) {
            if (!configData || !configData.works) return;
            const work = configData.works[index];
            if (!work) return;
            if (!confirm(`确定要删除作品「${work.name || '未命名'}」吗？`)) return;
            configData.works.splice(index, 1);
            const ok = await saveConfig(configData);
            if (ok) {
                renderWorks(configData.works);
                showToast('✅ 已删除');
            }
        }

        // ================================================================
        // 作品操作：打开添加弹窗
        // ================================================================
        function openAddWork() {
            formMode = 'add';
            formType = 'work';
            editId = null;
            $('formTitle').textContent = '➕ 添加作品';
            $('formBody').innerHTML = `
                <div class="form-group">
                    <label>作品名称 *</label>
                    <input type="text" id="fwName" placeholder="如：3D太阳系">
                </div>
                <div class="form-group">
                    <label>封面图路径</label>
                    <input type="text" id="fwCover" placeholder="xiaotaiyang.jpg（位于 CiweiManager/images/ 下）">
                    <div class="hint">留空则显示默认图标</div>
                </div>
                <div class="form-group">
                    <label>标签</label>
                    <input type="text" id="fwTags" placeholder="Three.js · 开普勒轨道">
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="fwDesc" rows="2" placeholder="简要描述作品亮点..."></textarea>
                </div>
                <div class="form-group">
                    <label>Netlify 链接（主用）</label>
                    <input type="url" id="fwPrimary" placeholder="https://xxx.netlify.app">
                    <div class="hint">留空则自动使用 GitHub 链接作为默认跳转</div>
                </div>
                <div class="form-group">
                    <label>GitHub 链接（备用） *</label>
                    <input type="url" id="fwFallback" placeholder="https://xiaociwei01.github.io/xxx/">
                    <div class="hint">必填，作为备用跳转地址</div>
                </div>
            `;
            $('formModal').classList.add('active');
            $('formSubmitBtn').textContent = '➕ 添加';
        }

        // ================================================================
        // 作品操作：打开编辑弹窗
        // ================================================================
        function openEditWork(index) {
            if (!configData || !configData.works) return;
            const work = configData.works[index];
            if (!work) return;

            formMode = 'edit';
            formType = 'work';
            editId = index;
            $('formTitle').textContent = '✏️ 编辑作品';
            $('formBody').innerHTML = `
                <div class="form-group">
                    <label>作品名称 *</label>
                    <input type="text" id="fwName" value="${escapeHtml(work.name || '')}">
                </div>
                <div class="form-group">
                    <label>封面图路径</label>
                    <input type="text" id="fwCover" value="${escapeHtml(work.cover || '')}" placeholder="xiaotaiyang.jpg">
                    <div class="hint">当前：${work.cover || '无'}</div>
                </div>
                <div class="form-group">
                    <label>标签</label>
                    <input type="text" id="fwTags" value="${escapeHtml(work.tags || '')}">
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="fwDesc" rows="2">${escapeHtml(work.desc || '')}</textarea>
                </div>
                <div class="form-group">
                    <label>Netlify 链接（主用）</label>
                    <input type="url" id="fwPrimary" value="${escapeHtml(work.primaryLink || '')}" placeholder="https://xxx.netlify.app">
                    <div class="hint">留空则自动使用 GitHub 链接</div>
                </div>
                <div class="form-group">
                    <label>GitHub 链接（备用） *</label>

                <div class="form-group">
                    <label>正文（支持 Markdown）</label>
                    <textarea id="ffContent" rows="4">${escapeHtml(item.content || '')}</textarea>

                <div class="form-group">

                    ${(item.videos || []).map(url => `<span style="font-size:12px;background:var(--bg-glass);padding:2px 10px;border-radius:12px;">🎬 ${url.split('/').pop()}</span>`).join('')}

                        ${(item.videos || []).map(url => `<span style="font-size:11px;color:var(--text-muted);background:var(--bg-glass);padding:2px 8px;border-radius:8px;">${url.split('/').pop()}</span>`).join('')}

        // ================================================================
        // 朋友圈置顶（表单内切换）
        // ================================================================
        function toggleFriendPinInForm() {
            window._ffPinned = !window._ffPinned;
            const track = $('ffPinnedTrack');
            const thumb = $('ffPinnedThumb');
            const label = $('ffPinnedLabel');
            if (window._ffPinned) {
                track.classList.add('active');
                thumb.style.left = '23px';
                label.textContent = '已置顶';
            } else {
                track.classList.remove('active');
                thumb.style.left = '3px';
                label.textContent = '不置顶';
            }
        }

        // ================================================================
        // 朋友圈上传（复用 write.html 逻辑）
        // ================================================================
        let friendUploadedFiles = [];

        function initFriendUpload() {
            const area = $('ffUploadArea');
            const input = $('ffFileInput');
            const status = $('ffUploadStatus');
            if (!area || !input) return;

            // 移除旧监听（简单处理：克隆替换）
            const newArea = area.cloneNode(true);
            area.parentNode.replaceChild(newArea, area);
            const newInput = newArea.querySelector('input[type="file"]');

            newArea.addEventListener('click', () => newInput.click());

            newArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                newArea.classList.add('dragover');
            });
            newArea.addEventListener('dragleave', () => newArea.classList.remove('dragover'));
            newArea.addEventListener('drop', (e) => {
                e.preventDefault();
                newArea.classList.remove('dragover');
                if (e.dataTransfer.files.length) handleFriendFiles(e.dataTransfer.files);
            });

            newInput.addEventListener('change', (e) => {
                if (e.target.files.length) handleFriendFiles(e.target.files);
                e.target.value = '';
            });

            // 保存引用
            window._ffUploadArea = newArea;
            window._ffFileInput = newInput;
        }

        async function handleFriendFiles(files) {
            const status = $('ffUploadStatus');
            if (!token) {
                status.innerHTML = '<span class="error">⚠️ 请先配置 GitHub Token</span>';
                $('tokenModal').classList.add('active');
                return;
            }

            const uploaded = [];
            for (const file of files) {
                if (file.size > 100 * 1024 * 1024) {
                    status.innerHTML = `<span class="error">❌ ${file.name} 超过 100MB</span>`;
                    continue;
                }
                status.innerHTML = `⏳ 正在上传 ${file.name} ...`;
                try {
                    const base64 = await readFileAsBase64(file);
                    const now = new Date();
                    const year = now.getFullYear();
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const ext = file.name.split('.').pop().toLowerCase();
                    const baseName = file.name.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '-') || 'file';
                    const filename = `friend-${Date.now()}-${Math.random().toString(36).slice(2, 6)}.${ext}`;
                    const path = `images/friends/${year}/${month}/${filename}`;
                    const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
                    const res = await fetch(url, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: `上传朋友圈媒体: ${file.name}`,
                            content: base64.split(',')[1],
                            branch: 'main'
                        })
                    });
                    if (res.ok) {
                        const cdnUrl = `https://cdn.jsdelivr.net/gh/${REPO}@main/${path}`;
                        uploaded.push({ url: cdnUrl, type: file.type.startsWith('video/') ? 'video' : 'image' });
                        status.innerHTML = `<span class="success">✅ ${file.name} 上传成功</span>`;
                        // 显示预览
                        const preview = $('ffMediaPreview');
                        if (preview) {
                            const tag = document.createElement('span');
                            tag.style.cssText =
                                'font-size:12px;background:var(--bg-glass);padding:2px 10px;border-radius:12px;';
                            tag.textContent = (file.type.startsWith('video/') ? '🎬' : '🖼️') + ' ' + file.name;
                            preview.appendChild(tag);
                        }
                    } else {
                        const err = await res.json();
                        status.innerHTML = `<span class="error">❌ 上传失败：${err.message || '未知错误'}</span>`;
                    }
                } catch (err) {
                    status.innerHTML = `<span class="error">❌ 上传失败：${err.message}</span>`;
                }
            }
            // 保存上传的 URL 供提交时使用
            if (!window._ffUploadedUrls) window._ffUploadedUrls = [];
            window._ffUploadedUrls = window._ffUploadedUrls.concat(uploaded);
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ================================================================
        // 提交表单（作品/朋友圈 共用）
        // ================================================================
        async function submitForm() {
            if (isSaving) return;
            isSaving = true;
            $('formSubmitBtn').disabled = true;
            $('formSubmitBtn').textContent = '⏳ 保存中...';

            try {
                if (formType === 'work') {
                    await submitWork();
                } else if (formType === 'friend') {
                    await submitFriend();
                }
            } catch (err) {
                showToast(`❌ 提交失败：${err.message}`, 'error');
            } finally {
                isSaving = false;
                $('formSubmitBtn').disabled = false;
                $('formSubmitBtn').textContent = formMode === 'add' ? '➕ 添加' : '💾 更新';
            }
        }

        // ================================================================
        // 提交作品
        // ================================================================
        async function submitWork() {
            const name = $('fwName').value.trim();
            const cover = $('fwCover').value.trim();
            const tags = $('fwTags').value.trim();
            const desc = $('fwDesc').value.trim();
            const primaryLink = $('fwPrimary').value.trim();
            const fallbackLink = $('fwFallback').value.trim();

            if (!name) { showToast('⚠️ 请填写作品名称', 'error'); return; }
            if (!fallbackLink) { showToast('⚠️ 请填写 GitHub 链接', 'error'); return; }

            if (!configData) configData = { site: {}, works: [], friends: [] };
            if (!configData.works) configData.works = [];

            const workData = {
                id: name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now(),
                name,
                enabled: true,
                cover: cover || '',
                tags: tags || '',
                desc: desc || '',
                primaryLink: primaryLink || '',
                fallbackLink: fallbackLink
            };

            if (formMode === 'add') {
                configData.works.push(workData);
            } else if (formMode === 'edit' && editId !== null) {
                configData.works[editId] = { ...configData.works[editId], ...workData };
            }

            const ok = await saveConfig(configData);
            if (ok) {
                renderWorks(configData.works);
                showToast(formMode === 'add' ? '✅ 作品已添加' : '✅ 作品已更新');
                closeFormModal();
            }
        }

        // ================================================================
        // 提交朋友圈
        // ================================================================
        async function submitFriend() {
            const title = $('ffTitle').value.trim();
            const content = $('ffContent').value.trim();
            const pinned = window._ffPinned || false;

            if (!title) { showToast('⚠️ 请填写标题', 'error'); return; }

            if (!configData) configData = { site: {}, works: [], friends: [] };
            if (!configData.friends) configData.friends = [];

            // 收集上传的媒体
            const uploaded = window._ffUploadedUrls || [];
            const images = [];
            const videos = [];
            uploaded.forEach(u => {
                if (u.type === 'image') images.push(u.url);
                else videos.push(u.url);
            });

            // 如果是编辑，保留已有媒体
            if (formMode === 'edit' && editId !== null) {
                const existing = configData.friends[editId] || {};
                // 保留已有的，追加新的
                images.push(...(existing.images || []));
                videos.push(...(existing.videos || []));
            }

            const friendData = {
                id: 'friend-' + Date.now(),
                title,
                content: content || '',
                date: new Date().toLocaleString('zh-CN', { hour12: false }),
                pinned: pinned,
                images: images,
                videos: videos,
                modified: ''
            };

            if (formMode === 'add') {
                configData.friends.push(friendData);
            } else if (formMode === 'edit' && editId !== null) {
                const existing = configData.friends[editId] || {};
                friendData.date = existing.date || friendData.date;
                friendData.modified = new Date().toLocaleString('zh-CN', { hour12: false });
                configData.friends[editId] = { ...existing, ...friendData };
            }

            const ok = await saveConfig(configData);
            if (ok) {
                renderFriends(configData.friends);
                showToast(formMode === 'add' ? '✅ 动态已添加' : '✅ 动态已更新');
                closeFormModal();
                window._ffUploadedUrls = [];
            }
        }

        // ================================================================
        // 朋友圈操作：置顶切换
        // ================================================================
        async function toggleFriendPin(index) {
            if (!configData || !configData.friends) return;
            const item = configData.friends[index];
            if (!item) return;
            item.pinned = !item.pinned;
            const ok = await saveConfig(configData);
            if (ok) {
                renderFriends(configData.friends);
                showToast(item.pinned ? '✅ 已置顶' : '✅ 已取消置顶');
            } else {
                item.pinned = !item.pinned;
            }
        }

        // ================================================================
        // 朋友圈操作：删除
        // ================================================================
        async function deleteFriend(index) {
            if (!configData || !configData.friends) return;
            const item = configData.friends[index];
            if (!item) return;
            if (!confirm(`确定要删除动态「${item.title || '未命名'}」吗？`)) return;
            configData.friends.splice(index, 1);
            const ok = await saveConfig(configData);
            if (ok) {
                renderFriends(configData.friends);
                showToast('✅ 已删除');
            }
        }

        // ================================================================
        // 头像更换
        // ================================================================
        async function handleAvatarChange(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!token) {
                showToast('⚠️ 请先配置 GitHub Token', 'error');
                $('tokenModal').classList.add('active');
                return;
            }

            if (!configData) {
                showToast('⚠️ 请先加载数据', 'error');
                return;
            }

            try {
                const base64 = await readFileAsBase64(file);
                const ext = file.name.split('.').pop().toLowerCase();
                const filename = `avatar-${Date.now()}.${ext}`;
                const path = `images/avatar/${filename}`;

                // 获取旧头像路径
                const oldAvatar = configData.site?.avatar || '';

                // 上传新头像
                const url = `https://api.github.com/repos/${REPO}/contents/${path}`;
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `更换头像: ${file.name}`,
                        content: base64.split(',')[1],
                        branch: 'main'
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || '上传失败');
                }

                // 更新 config
                if (!configData.site) configData.site = {};
                configData.site.avatar = path;
                const ok = await saveConfig(configData);

                if (ok) {
                    // 删除旧头像（如果存在且不是默认的）
                    if (oldAvatar && !oldAvatar.includes('ciweitouxiang.jpg') && oldAvatar !== path) {
                        try {
                            const delUrl = `https://api.github.com/repos/${REPO}/contents/${oldAvatar}`;
                            const getRes = await fetch(delUrl, { headers: { 'Authorization': `token ${token}` } });
                            if (getRes.ok) {
                                const fileData = await getRes.json();
                                await fetch(delUrl, {
                                    method: 'DELETE',
                                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        message: `删除旧头像: ${oldAvatar}`,
                                        sha: fileData.sha,
                                        branch: 'main'
                                    })
                                });
                            }
                        } catch (e) { /* 忽略删除失败 */ }
                    }

                    // 更新预览
                    const avatarUrl = `https://cdn.jsdelivr.net/gh/${REPO}@main/${path}`;
                    $('avatarImg').src = avatarUrl + '?t=' + Date.now();
                    showToast('✅ 头像已更换');
                }

            } catch (err) {
                showToast(`❌ 更换头像失败：${err.message}`, 'error');
            }

            event.target.value = '';
        }

        // ================================================================
        // 保存设置
        // ================================================================
        async function saveSettings() {
            if (!configData) {
                showToast('⚠️ 请先加载数据', 'error');
                return;
            }

            if (!configData.site) configData.site = {};

            configData.site.title = $('setTitle').value.trim() || '🦔 刺猬的家';
            configData.site.subtitle = $('setSubtitle').value.trim() || '独立开发者';
            configData.site.signature = $('setSignature').value.trim();
            configData.site.wechat = $('setWechat').value.trim();
            configData.site.qq = $('setQq').value.trim();

            const ok = await saveConfig(configData);
            if (ok) {
                showToast('✅ 设置已保存');
            }
        }

        // ================================================================
        // 辅助：关闭模态框
        // ================================================================
        function closeFormModal() {
            $('formModal').classList.remove('active');
            window._ffUploadedUrls = [];
            window._ffPinned = false;
        }

        $('formModal').addEventListener('click', (e) => {
            if (e.target === $('formModal')) closeFormModal();
        });

        // ================================================================
        // 辅助：HTML 转义
        // ================================================================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ================================================================
        // 初始化
        // ================================================================
        initTheme();

        // 检查 Token
        const hasToken = loadToken();

        if (hasToken) {
            loadAllData();
        } else {
            $('worksList').innerHTML = `<div class="empty-state"><div class="icon">🔑</div><div>请先点击右上角配置 GitHub Token</div></div>`;
            $('friendsList').innerHTML = `<div class="empty-state"><div class="icon">🔑</div><div>请先点击右上角配置 GitHub Token</div></div>`;
            $('tokenModal').classList.add('active');
        }

        // 暴露全局函数供 HTML 调用
        window.loadAllData = loadAllData;
        window.openAddWork = openAddWork;
        window.openEditWork = openEditWork;
        window.deleteWork = deleteWork;
        window.toggleWork = toggleWork;
        window.openAddFriend = openAddFriend;
        window.openEditFriend = openEditFriend;
        window.deleteFriend = deleteFriend;
        window.toggleFriendPin = toggleFriendPin;
        window.toggleFriendPinInForm = toggleFriendPinInForm;
        window.submitForm = submitForm;
        window.closeFormModal = closeFormModal;
        window.handleAvatarChange = handleAvatarChange;
        window.saveSettings = saveSettings;
        window.saveToken = saveToken;
        window.clearToken = clearToken;
        window.escapeHtml = escapeHtml;

        console.log('🦔 CiweiManager 已启动');
        console.log('📦 作品管理 + 📝 朋友圈管理 + ⚙️ 网站设置');
        console.log('🌓 深色/浅色模式已启用');
    </script>
